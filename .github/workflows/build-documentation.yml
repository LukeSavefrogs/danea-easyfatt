name: Build the documentation

on:
  workflow_call:
    inputs:
      base-url:
        required: true
        description: "The base url of the built documentation"
        type: string
  workflow_dispatch:
    inputs:
      base-url:
        required: true
        description: "The base url of the built documentation"
        type: string
  push:
    paths:
      - 'docs/**'
      - '**.md'
      - '**.yml'
      - '**.html'
      - Gemfile
      - Gemfile.lock
      - _config.yml
      - .github/workflows/build-documentation.yml
      - .ruby-version

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 0

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${BASE_URL:-/}"
        env:
          JEKYLL_ENV: production
          BASE_URL: ${{ inputs.base-url }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: _site
